<html>
<head>
  <title>Book Consultation</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0b132b;
      color: white;
      text-align: center;
      padding: 50px;
    }

    form {
      background: #1c2541;
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
    }

    input, textarea {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      background: #FFD700;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Book Consultation</h1>

<form>
  <input type="text" placeholder="Your Name" required><br>
  <input type="email" placeholder="Your Email" required><br>
  <input type="text" placeholder="Phone Number" required><br>
  <textarea placeholder="Your Problem"></textarea><br>
  <button type="submit">Submit</button>
</form>

</body>
</html>
